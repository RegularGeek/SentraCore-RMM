<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RMM · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-body">
  <form class="login-card" id="loginForm">
    <div class="brand" style="margin-bottom: 22px;">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">RMM <span class="brand-sub">// sign in</span></span>
    </div>
    <label class="login-label">Username</label>
    <input class="login-input" id="username" name="username" autocomplete="username" autofocus />
    <label class="login-label">Password</label>
    <input class="login-input" id="password" name="password" type="password" autocomplete="current-password" />
    <button class="login-btn" type="submit">Sign in</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-hint">First time? Run <code>npm run seed</code> in <code>/server</code> for a login and agent token.</div>
  </form>
  <script src="/login.js"></script>
</body>
</html>
