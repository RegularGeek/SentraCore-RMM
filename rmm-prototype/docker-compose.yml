# Runs just the SentraCore RMM server. Caddy (or your own reverse proxy)
# sits in front of this and terminates TLS — see deploy/Caddyfile.
#
# Usage:
#   cp deploy/.env.example .env   # then edit it (SESSION_SECRET, SEED_ADMIN_*)
#   docker compose up -d --build
#   docker compose exec server npm run seed
services:
  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8787
    ports:
      - "127.0.0.1:8787:8787"   # bound to localhost; Caddy proxies to it
    volumes:
      - rmm_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rmm_data:
